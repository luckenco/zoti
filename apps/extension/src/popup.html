<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Save to Herodotus</title>
    <style>
      :root {
        --ink: #1c1917;
        --muted: #78716c;
        --paper: #faf7f2;
        --field: #ffffff;
        --line: #e7e5e4;
        --accent: #9a3412;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --paper: #1c1917;
          --field: #292524;
          --line: #44403c;
          --accent: #fdba74;
        }
      }
      body {
        margin: 0;
        width: 320px;
        font: 14px/1.45 system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        gap: 14px;
        padding: 18px;
      }
      h1 {
        margin: 0;
        font: 600 15px/1.2 ui-serif, Georgia, serif;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        min-height: 2.9em;
        color: var(--muted);
        font-size: 13px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
        font: 14px/1.2 system-ui, sans-serif;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      input:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      button {
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        font: 600 14px/1.2 system-ui, sans-serif;
        cursor: pointer;
        transition: transform 160ms var(--ease-out), opacity 150ms ease;
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        cursor: progress;
        opacity: 0.6;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: opacity 150ms ease;
        }
        button:active:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Save to Herodotus</h1>
      <p id="status" role="status" aria-live="polite">Saves this page, or your selected text.</p>
      <label>
        Tags
        <input id="tags" type="text" placeholder="reading, later" autocomplete="off" />
      </label>
      <button id="save" type="button">Save</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
