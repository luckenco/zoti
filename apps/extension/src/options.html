<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Herodotus options</title>
    <style>
      :root {
        --ink: #1c1917;
        --muted: #78716c;
        --paper: #faf7f2;
        --field: #ffffff;
        --line: #e7e5e4;
        --accent: #9a3412;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --paper: #1c1917;
          --field: #292524;
          --line: #44403c;
          --accent: #fdba74;
        }
      }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 30rem;
        padding: 32px 24px;
      }
      h1 {
        margin: 0 0 6px;
        font: 600 22px/1.2 ui-serif, Georgia, serif;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
        font: 14px/1.2 system-ui, sans-serif;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      input:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      button {
        justify-self: start;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        font: 600 14px/1.2 system-ui, sans-serif;
        cursor: pointer;
        transition: transform 160ms var(--ease-out);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        min-height: 1.5em;
        margin: 16px 0 0;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Herodotus</h1>
      <p>Connect this browser to your Herodotus Worker. Use the token for the chrome identity in AUTH_TOKENS.</p>
      <form id="settings">
        <label>
          Worker URL
          <input id="workerUrl" type="url" name="workerUrl" required placeholder="https://herodotus-ingress.example.workers.dev" />
        </label>
        <label>
          Bearer token
          <input id="token" type="password" name="token" required autocomplete="off" spellcheck="false" />
        </label>
        <button type="submit">Save</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
